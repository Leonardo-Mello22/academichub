{% extends "base.html" %}
{% block title %}Nova Mensagem — AcademiPortal{% endblock %}

{% block content %}
<div class="page-header">
  <h2>✉️ Nova Mensagem</h2>
  <a href="/mensagens" class="btn btn-secondary">← Cancelar</a>
</div>

<div class="card form-card">
  <form method="POST" action="/mensagens/nova">
    <div class="form-group">
      <label>Para (usuário)</label>
      <select name="recipient" class="form-control form-select" required>
        <option value="">— Selecione —</option>
        {% for u in users %}
        <option value="{{ u[0] }}" {% if u[0] == para %}selected{% endif %}>{{ u[1] or u[0] }} (@{{ u[0] }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Assunto</label>
      <input type="text" name="subject" class="form-control" placeholder="Assunto da mensagem" required>
    </div>
    <div class="form-group">
      <label>Mensagem</label>
      <textarea name="body" class="form-control" rows="6" placeholder="Escreva sua mensagem aqui..." required></textarea>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Enviar</button>
  </form>
</div>
{% endblock %}
