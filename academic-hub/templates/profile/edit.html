{% extends "base.html" %}
{% block title %}Editar Perfil — AcademiPortal{% endblock %}

{% block content %}
<div class="page-header">
  <h2>✏️ Editar Perfil</h2>
  <a href="/perfil/{{ session.get('user_id') }}" class="btn btn-secondary">← Cancelar</a>
</div>

<div class="card form-card">
  <form method="POST" action="/perfil/editar">
    <div class="form-group">
      <label>Nome completo</label>
      <input type="text" name="full_name" class="form-control" value="{{ user[5] or '' }}">
    </div>
    <div class="form-group">
      <label>Bio</label>
      <textarea name="bio" class="form-control" rows="4">{{ user[8] or '' }}</textarea>
    </div>
    <input type="hidden" name="role" value="{{ user[4] }}">
    <button type="submit" class="btn btn-primary btn-block">Salvar Alterações</button>
  </form>
</div>
{% endblock %}
