{% extends "base.html" %}
{% block title %}Criar Conta — AcademiPortal{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-logo">
    <span class="logo-icon">🎓</span>
    <h1>AcademiPortal</h1>
    <p class="auth-subtitle">Criar nova conta</p>
  </div>

  {% if error %}
  <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/registro">
    <div class="form-group">
      <label for="full_name">Nome completo</label>
      <input type="text" id="full_name" name="full_name" class="form-control" placeholder="ex: Maria Souza" required>
    </div>
    <div class="form-group">
      <label for="username">Usuário</label>
      <input type="text" id="username" name="username" class="form-control" placeholder="ex: maria.souza" required>
    </div>
    <div class="form-group">
      <label for="email">E-mail institucional</label>
      <input type="email" id="email" name="email" class="form-control" placeholder="ex: maria@aluno.academiportal.edu.br" required>
    </div>
    <div class="form-group">
      <label for="password">Senha</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Criar Conta</button>
  </form>

  <div class="auth-links">
    <a href="/login">Já tenho conta</a>
  </div>
</div>
{% endblock %}
